[project]
name = "disent-kws"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "onnxruntime==1.18.1",
    "openai-whisper>=20250625",
    "pyroomacoustics>=0.10.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "speechbrain>=1.1.0",
    "torch>=2.12.0",
    "torch-audiomentations>=0.12.0",
    "torchaudio>=2.11.0",
    "wandb>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --disable-warnings --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests requiring GPU",
]
